<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro - Conheça a Austrália</title>
  <link rel="stylesheet" href="css/auth.css">
</head>
<body>
  <main class="caixa">
    <a class="voltar" href="index.html">← Voltar ao início</a>
    <h1>Cadastro</h1>
    <p class="subtitulo">Preencha os campos para criar sua conta.</p>
    <div id="mensagem" class="mensagem" role="alert"></div>
    <form id="formCadastro">
      <div class="campo">
        <label for="nome">Nome completo</label>
        <input type="text" id="nome" minlength="3" required>
      </div>
      <div class="campo">
        <label for="email">E-mail</label>
        <input type="email" id="email" required>
      </div>
      <div class="campo">
        <label for="senha">Senha (mínimo 8 caracteres)</label>
        <input type="password" id="senha"  minlength="8"    required>
      </div>
      <div class="campo">
        <label for="confirmarSenha">Confirmar senha</label>
        <input type="password" id="confirmarSenha" minlength="8" required>
      </div>
      <button type="submit">Cadastrar</button>
    </form>
    <p class="rodape-form">Já tem uma conta? <a href="login.html">Faça login</a></p>
  </main>
  <script src="js/auth.js"></script>
</body>
</html>
